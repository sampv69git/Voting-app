# Docker Swarm Stack file
# For single-node swarm: docker swarm init
# Deploy:  docker stack deploy --compose-file docker-stack.yml vote
# Remove:  docker stack rm vote
#
# Built by Shreyas TK (github.com/shreyastk)

version: "3.9"

services:
  redis:
    image: redis:alpine
    networks:
      - frontend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  vote:
    image: ghcr.io/shreyastk/voting-app-vote:latest
    ports:
      - 8080:80
    networks:
      - frontend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  result:
    image: ghcr.io/shreyastk/voting-app-result:latest
    ports:
      - 8081:80
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: ghcr.io/shreyastk/voting-app-worker:latest
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

networks:
  frontend:
  backend:

volumes:
  db-data:
