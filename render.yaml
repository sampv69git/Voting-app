databases:
  - name: voting-app-db
    databaseName: votingdb
    user: dbuser

services:
  # 1. Managed Redis
  - type: redis
    name: voting-app-redis
    plan: free
    ipAllowList: []

  # 2. Vote App (Python)
  - type: web
    name: voting-app-vote
    env: docker
    dockerContext: ./vote
    dockerfilePath: ./vote/Dockerfile
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: voting-app-redis
          property: connectionString

  # 3. Result App (Node.js)
  - type: web
    name: voting-app-result
    env: docker
    dockerContext: ./result
    dockerfilePath: ./result/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voting-app-db
          property: connectionString

  # 4. Worker App (.NET)
  - type: pserv
    name: voting-app-worker
    env: docker
    dockerContext: ./worker
    dockerfilePath: ./worker/Dockerfile
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: voting-app-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: voting-app-db
          property: connectionString
